table:
  name: organizations
  schema: public
object_relationships:
  - name: usage_stats
    using:
      manual_configuration:
        column_mapping:
          id: org_id
        insertion_order: null
        remote_table:
          name: org_usage_stats
          schema: public
array_relationships:
  - name: members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: org_members
          schema: public
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflows
          schema: public
  - name: runs
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflow_runs
          schema: public
insert_permissions:
  - role: user
    permission:
      check: {}
      set:
        created_by: x-hasura-User-Id
      columns:
        - name
    comment: Anyone signed in can create an org; a DB trigger makes them its owner
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - name
        - quota_limit
        - quota_used
        - quota_period_start
        - created_at
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
      allow_aggregations: true
    comment: Layer 1 - visible only to members of the org
update_permissions:
  - role: user
    permission:
      columns:
        - name
        - quota_limit
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
          role:
            _eq: owner
      check: {}
    comment: Only owners can rename the org or change its quota
