table:
  name: workflow_triggers
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
                  role:
                    _in:
                      - owner
                      - editor
          - _or:
              - type:
                  _neq: webhook
              - workflow:
                  organization:
                    members:
                      user_id:
                        _eq: X-Hasura-User-Id
                      role:
                        _eq: owner
      columns:
        - workflow_id
        - type
        - config
        - is_enabled
    comment: 'Layer 2: webhook triggers are owner-only; webhook_key is generated by the database'
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - type
        - config
        - is_enabled
        - last_fired_at
        - created_at
      filter:
        workflow:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
    comment: webhook_key is deliberately not selectable; owners/editors fetch it via the revealWebhookKey action
update_permissions:
  - role: user
    permission:
      columns:
        - config
        - is_enabled
      filter:
        workflow:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _in:
                  - owner
                  - editor
      check: {}
    comment: Type is immutable after creation so an editor cannot repoint a trigger to webhook
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
                  role:
                    _in:
                      - owner
                      - editor
          - _or:
              - type:
                  _neq: webhook
              - workflow:
                  organization:
                    members:
                      user_id:
                        _eq: X-Hasura-User-Id
                      role:
                        _eq: owner
    comment: Editors can remove non-webhook triggers; webhook triggers are owner-only
