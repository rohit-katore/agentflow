table:
  name: workflows
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
array_relationships:
  - name: steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_steps
          schema: public
  - name: triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_triggers
          schema: public
  - name: runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_runs
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _in:
                - owner
                - editor
      set:
        created_by: x-hasura-User-Id
      columns:
        - org_id
        - name
        - description
        - is_active
    comment: Layer 1 - owners and editors of the org can create workflows
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - name
        - description
        - is_active
        - created_by
        - created_at
        - updated_at
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
      allow_aggregations: true
    comment: Layer 1 - any member of the org (including viewers) can read
update_permissions:
  - role: user
    permission:
      columns:
        - name
        - description
        - is_active
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _in:
                - owner
                - editor
      check: {}
    comment: Owners and editors can edit
delete_permissions:
  - role: user
    permission:
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _eq: owner
    comment: Deleting a whole workflow is owner-only
